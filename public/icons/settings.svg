<svg xmlns="http://www.w3.org/2000/svg" viewBox="235 70 430 430" width="100%" height="100%">
  <defs>
    <!-- Background Light Gradient -->
    <linearGradient id="pmc-settings-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Main Gear Gradient -->
    <linearGradient id="pmc-settings-gearMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Secondary Gear Gradient -->
    <linearGradient id="pmc-settings-gearSecond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Slider Track Gradient -->
    <linearGradient id="pmc-settings-trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="pmc-settings-dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="pmc-settings-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="600" fill="url(#pmc-settings-bgGrad)"/>

  <!-- CIRCLE BACKING WITH GLOW -->
  <g filter="url(#pmc-settings-glow)" transform="translate(400, 290)" opacity="0.9">
    <circle cx="0" cy="0" r="196" fill="#FFFFFF"/>
  </g>

  <!-- BACKGROUND DECORATIVE PULSE LINE -->
  <path d="M 50 320 H 220 L 240 280 L 260 360 L 280 290 L 300 330 L 320 320 H 480 L 500 280 L 520 360 L 540 290 L 560 330 L 580 320 H 750"
        fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- GEARS -->
  <g filter="url(#pmc-settings-dropShadow)">

    <!-- ==================== SECONDARY GEAR (UPPER RIGHT) ==================== -->
    <g>
      <path d="M 669.4,188.4 660.6,209.7 639.6,205.2 627.2,217.6 631.7,238.6 610.4,247.4 598.7,229.4 581.3,229.4 569.6,247.4 548.3,238.6 552.8,217.6 540.4,205.2 519.4,209.7 510.6,188.4 528.6,176.7 528.6,159.3 510.6,147.6 519.4,126.3 540.4,130.8 552.8,118.4 548.3,97.4 569.6,88.6 581.3,106.6 598.7,106.6 610.4,88.6 631.7,97.4 627.2,118.4 639.6,130.8 660.6,126.3 669.4,147.6 651.4,159.3 651.4,176.7 Z" fill="url(#pmc-settings-gearSecond)" stroke="#1E293B" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="590" cy="168" r="30" fill="#F0F9FF"/>
      <circle cx="590" cy="168" r="17" fill="#94A3B8"/>
    </g>

    <!-- ==================== MAIN GEAR ==================== -->
    <g>
      <path d="M 544.6,260.0 549.9,293.4 517.9,305.2 513.7,331.5 540.5,352.6 525.1,382.7 492.3,373.5 473.5,392.3 482.7,425.1 452.6,440.5 431.5,413.7 405.2,417.9 393.4,449.9 360.0,444.6 358.6,410.5 334.9,398.4 306.6,417.4 282.6,393.4 301.6,365.1 289.5,341.4 255.4,340.0 250.1,306.6 282.1,294.8 286.3,268.5 259.5,247.4 274.9,217.3 307.7,226.5 326.5,207.7 317.3,174.9 347.4,159.5 368.5,186.3 394.8,182.1 406.6,150.1 440.0,155.4 441.4,189.5 465.1,201.6 493.4,182.6 517.4,206.6 498.4,234.9 510.5,258.6 Z" fill="url(#pmc-settings-gearMain)" stroke="#0369A1" stroke-width="2" stroke-linejoin="round"/>
      <!-- Hub -->
      <circle cx="400" cy="300" r="58" fill="#FFFFFF"/>
      <circle cx="400" cy="300" r="40" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="3"/>
      <!-- Medical Cross in the hub, tying it to the rest of the set -->
      <path d="M -9 -26 H 9 V -9 H 26 V 9 H 9 V 26 H -9 V 9 H -26 V -9 H -9 Z"
            transform="translate(400, 300)" fill="#EF4444"/>
    </g>

    <!-- ==================== SLIDERS (LOWER LEFT) ==================== -->
    <g transform="translate(150, 400)">
      <!-- Track 1 -->
      <rect x="0" y="0" width="190" height="18" rx="9" fill="url(#pmc-settings-trackGrad)"/>
      <circle cx="132" cy="9" r="17" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="4"/>
      <!-- Track 2 -->
      <rect x="0" y="52" width="190" height="18" rx="9" fill="url(#pmc-settings-trackGrad)"/>
      <circle cx="62" cy="61" r="17" fill="#FFFFFF" stroke="#0284C7" stroke-width="4"/>
    </g>

  </g>

  <!-- FOREGROUND ACCENTS / SPARKLES -->
  <g fill="#38BDF8" opacity="0.6">
    <path d="M 140 150 L 143 158 L 151 161 L 143 164 L 140 172 L 137 164 L 129 161 L 137 158 Z"/>
    <path d="M 690 420 L 692 426 L 698 428 L 692 430 L 690 436 L 688 430 L 682 428 L 688 426 Z"/>
    <path d="M 690 280 H 704 V 284 H 690 Z M 695 275 V 289 H 699 V 275 Z"/>
    <path d="M 100 200 H 114 V 204 H 100 Z M 105 195 V 209 H 109 V 195 Z"/>
  </g>
</svg>
