<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Light Blue Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </radialGradient>

    <!-- Wallet Leather Gradient -->
    <linearGradient id="walletMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="walletInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Cash/Bill Gradient -->
    <linearGradient id="cashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Outflow Red Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.18" />
    </filter>

    <filter id="shadow-arrow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- BACKGROUND (LIGHT VERY LIGHT BLUE) -->
  <rect width="800" height="800" rx="40" fill="url(#bgGlow)" />

  <!-- DECORATIVE GRID LINES -->
  <g stroke="#93C5FD" stroke-width="1" stroke-dasharray="4 8" opacity="0.35">
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="400" x2="700" y2="400" />
    <line x1="100" y1="600" x2="700" y2="600" />
    <line x1="200" y1="100" x2="200" y2="700" />
    <line x1="400" y1="100" x2="400" y2="700" />
    <line x1="600" y1="100" x2="600" y2="700" />
  </g>

  <!-- WALLET & CASH GROUP -->
  <g transform="translate(0, 70)">
    
    <!-- WALLET BACK INTERIOR -->
    <path d="M 260 420 C 260 380, 290 350, 330 350 L 550 350 C 590 350, 620 380, 620 420 L 620 540 C 620 580, 590 610, 550 610 L 330 610 C 290 610, 260 580, 260 540 Z" fill="url(#walletInner)" filter="url(#shadow-main)" />

    <!-- FLYING CASH BILL 2 (Fading/Smaller in Back) -->
    <g transform="translate(420, 260) rotate(-25) scale(0.75)" opacity="0.8">
      <rect x="-100" y="-50" width="200" height="100" rx="12" fill="url(#cashGrad)" stroke="#A7F3D0" stroke-width="2" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#A7F3D0" stroke-width="3" opacity="0.6" />
      <circle cx="-60" cy="0" r="12" fill="#A7F3D0" opacity="0.3" />
      <circle cx="60" cy="0" r="12" fill="#A7F3D0" opacity="0.3" />
      <!-- Dollar Sign -->
      <text x="0" y="10" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F0FDFA" text-anchor="middle">$</text>
    </g>

    <!-- FLYING CASH BILL 1 (Main Flying Bill) -->
    <g transform="translate(450, 210) rotate(-15)" filter="url(#shadow-main)">
      <!-- Motion Lines for Cash -->
      <path d="M -80 70 Q -60 110 -40 130" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="4 6" opacity="0.5" />
      <path d="M 80 70 Q 100 110 120 130" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="4 6" opacity="0.5" />
      
      <!-- Bill Body -->
      <rect x="-110" y="-55" width="220" height="110" rx="14" fill="url(#cashGrad)" stroke="#A7F3D0" stroke-width="3" />
      <!-- Bill Pattern -->
      <rect x="-95" y="-42" width="190" height="84" rx="8" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="0" cy="0" r="26" fill="#047857" opacity="0.2" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#A7F3D0" stroke-width="3" />
      <!-- Bill Corners -->
      <circle cx="-80" cy="-30" r="8" fill="#A7F3D0" opacity="0.5" />
      <circle cx="80" cy="-30" r="8" fill="#A7F3D0" opacity="0.5" />
      <circle cx="-80" cy="30" r="8" fill="#A7F3D0" opacity="0.5" />
      <circle cx="80" cy="30" r="8" fill="#A7F3D0" opacity="0.5" />
      <!-- Dollar Sign -->
      <text x="0" y="12" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#F0FDFA" text-anchor="middle">$</text>
    </g>

    <!-- WALLET FRONT POCKET -->
    <path d="M 240 450 C 240 410, 270 380, 310 380 L 570 380 C 610 380, 640 410, 640 450 L 640 550 C 640 590, 610 620, 570 620 L 310 620 C 270 620, 240 590, 240 550 Z" fill="url(#walletMain)" filter="url(#shadow-main)" />
    
    <!-- Wallet Stitching & Accent -->
    <path d="M 252 455 C 252 422, 277 392, 310 392 L 570 392 C 603 392, 628 422, 628 455" fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.9" />
    <path d="M 240 460 Q 440 500 640 460" fill="none" stroke="#1D4ED8" stroke-width="4" />

    <!-- WALLET CLASP / FLAP -->
    <path d="M 570 470 L 645 470 C 658 470, 665 480, 665 490 L 665 510 C 665 520, 658 530, 645 530 L 570 530 Z" fill="url(#walletInner)" />
    <circle cx="635" cy="500" r="10" fill="url(#coinGrad)" stroke="#B45309" stroke-width="2" />

    <!-- FLYING COINS -->
    <!-- Coin 1 -->
    <g transform="translate(280, 280)" filter="url(#shadow-main)">
      <circle cx="0" cy="0" r="20" fill="url(#coinGrad)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" />
    </g>
    <!-- Coin 2 -->
    <g transform="translate(580, 230) scale(0.8)" filter="url(#shadow-main)">
      <circle cx="0" cy="0" r="20" fill="url(#coinGrad)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 3" />
    </g>
    <!-- Coin 3 (Small back) -->
    <g transform="translate(360, 200) scale(0.6)" opacity="0.85">
      <circle cx="0" cy="0" r="20" fill="url(#coinGrad)" stroke="#FEF3C7" stroke-width="2" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="#B45309" stroke-width="1.5" />
    </g>
  </g>

  <!-- OUTFLOW ARROW (MAIN RED UPWARD/OUTWARD ARROW) -->
  <g filter="url(#shadow-arrow)" transform="translate(0, 30)">
    <!-- Motion Tail Trails -->
    <path d="M 230 480 C 180 420, 180 300, 230 200" fill="none" stroke="#EF4444" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12" opacity="0.35" />
    <path d="M 270 490 C 230 430, 220 310, 270 210" fill="none" stroke="#F87171" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10" opacity="0.5" />

    <!-- Curved Arrow Body -->
    <path d="M 400 480 
             C 270 480, 200 380, 220 250 
             L 170 265 
             L 235 130 
             L 330 225 
             L 278 238 
             C 265 330, 310 400, 400 410 
             Z" 
          fill="url(#arrowGrad)" />
    
    <!-- Arrow Highlight Line -->
    <path d="M 390 470 C 280 470, 215 380, 232 260" fill="none" stroke="#FECDD3" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- FLOATING OUTFLOW PARTICLES / MINUS SIGNS -->
  <!-- Minus 1 -->
  <g transform="translate(160, 180) rotate(-15)">
    <rect x="-18" y="-5" width="36" height="10" rx="5" fill="#EF4444" />
  </g>
  <!-- Minus 2 -->
  <g transform="translate(480, 130) rotate(12)">
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="#EF4444" opacity="0.85" />
  </g>
  <!-- Minus 3 -->
  <g transform="translate(210, 360) rotate(-40)">
    <rect x="-12" y="-3" width="24" height="6" rx="3" fill="#DC2626" opacity="0.7" />
  </g>

  <!-- Sparkles / Burst Dots -->
  <circle cx="130" cy="240" r="4" fill="#F87171" />
  <circle cx="280" cy="140" r="5" fill="#F87171" />
  <circle cx="490" cy="180" r="3" fill="#F87171" />
  <circle cx="210" cy="120" r="6" fill="#DC2626" />

</svg>
