<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Light Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <!-- Outflow Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Banknote Gradient -->
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- CIRCLE BACKING WITH GLOW -->
  <g filter="url(#glow)" transform="translate(390, 300)" opacity="0.9">
    <circle cx="0" cy="0" r="212" fill="#FFFFFF"/>
  </g>

  <!-- BACKGROUND DECORATIVE PULSE LINE -->
  <path d="M 50 320 H 220 L 240 280 L 260 360 L 280 290 L 300 330 L 320 320 H 480 L 500 280 L 520 360 L 540 290 L 560 330 L 580 320 H 750"
        fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <g filter="url(#dropShadow)">

    <!-- ==================== BANKNOTE (BEHIND) ==================== -->
    <g transform="translate(360, 168) rotate(-9)">
      <rect x="-150" y="-62" width="300" height="124" rx="14" fill="url(#noteGrad)" stroke="#059669" stroke-width="3"/>
      <rect x="-128" y="-42" width="256" height="84" rx="8" fill="none" stroke="#A7F3D0" stroke-width="3"/>
      <circle cx="0" cy="0" r="30" fill="#A7F3D0"/>
      <!-- Rupee mark -->
      <path d="M -13 -17 H 13 M -13 -6 H 13 M 8 -17 C 8 -1, -13 -1, -13 -1 L 10 18"
            fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-112" cy="0" r="9" fill="#A7F3D0"/>
      <circle cx="112" cy="0" r="9" fill="#A7F3D0"/>
    </g>

    <!-- ==================== COIN STACK ==================== -->
    <g>
      <ellipse cx="300" cy="406" rx="104" ry="32" fill="#D97706"/>
      <ellipse cx="300" cy="392" rx="104" ry="32" fill="#FBBF24"/>
      <ellipse cx="300" cy="392" rx="74" ry="20" fill="#FCD34D"/>
      <ellipse cx="300" cy="370" rx="104" ry="32" fill="#D97706"/>
      <ellipse cx="300" cy="356" rx="104" ry="32" fill="#FBBF24"/>
      <ellipse cx="300" cy="356" rx="74" ry="20" fill="#FCD34D"/>
      <ellipse cx="300" cy="334" rx="104" ry="32" fill="#D97706"/>
      <ellipse cx="300" cy="320" rx="104" ry="32" fill="#FBBF24"/>
      <ellipse cx="300" cy="320" rx="74" ry="20" fill="#FCD34D"/>
      <ellipse cx="300" cy="298" rx="104" ry="32" fill="#D97706"/>
      <ellipse cx="300" cy="284" rx="104" ry="32" fill="#FBBF24"/>
      <ellipse cx="300" cy="284" rx="74" ry="20" fill="#FCD34D"/>
    </g>

    <!-- ==================== OUTFLOW ARROW ==================== -->
    <g transform="translate(578, 300)">
      <path d="M -34 -128 H 34 V 22 H 78 L 0 132 L -78 22 H -34 Z"
            fill="url(#arrowGrad)" stroke="#B91C1C" stroke-width="3" stroke-linejoin="round"/>
    </g>

  </g>

  <!-- FOREGROUND ACCENTS / SPARKLES -->
  <g fill="#38BDF8" opacity="0.6">
    <path d="M 140 150 L 143 158 L 151 161 L 143 164 L 140 172 L 137 164 L 129 161 L 137 158 Z"/>
    <path d="M 690 470 L 692 476 L 698 478 L 692 480 L 690 486 L 688 480 L 682 478 L 688 476 Z"/>
    <path d="M 690 150 H 704 V 154 H 690 Z M 695 145 V 159 H 699 V 145 Z"/>
    <path d="M 100 440 H 114 V 444 H 100 Z M 105 435 V 449 H 109 V 435 Z"/>
  </g>
</svg>
